name: Feature request
description: Something tomoshibi should be able to do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Worth a look at [docs/ROADMAP.md](../blob/main/docs/ROADMAP.md) first —
        it has both what's planned and what's deliberately out of scope. Cloud
        sync, accounts, mobile and multi-profile are off the list on purpose:
        tomoshibi is a local-first, single-user desktop app.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: |
        The study problem, not the feature. "I lose track of which subject needs
        the most work" leads somewhere better than "add a chart".
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: If you already have a shape in mind, describe it.
    validations:
      required: false

  - type: textarea
    id: today
    attributes:
      label: How you handle it today
      description: What you do instead right now, in tomoshibi or outside it.
    validations:
      required: false
