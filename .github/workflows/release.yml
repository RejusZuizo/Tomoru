name: release

# Push a version tag and the three platform builds assemble themselves.
# Each OS packs its own build on purpose: the Windows build targets the
# Windows TFM for toast notifications, and mac/Windows carry their own native
# libvlc, so cross-publishing from one runner would produce broken downloads.
#
# The release is created as a DRAFT with the artifacts attached — publishing
# stays a human decision. Flip `draft: false` below if you'd rather it go
# straight out.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # lets you rehearse the packaging without tagging

permissions:
  contents: write         # needed to create the release

jobs:
  pack:
    name: pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing shouldn't throw away the builds that worked.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: ./scripts/pack-linux.sh
          - os: macos-latest
            script: ./scripts/pack-mac.sh
          - os: windows-latest
            script: pwsh scripts/pack-win.ps1

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # The same suite the ci workflow runs — a tag shouldn't be able to
      # produce a download from code that doesn't pass its own tests.
      - name: Test
        run: dotnet test Tomoshibi.sln --configuration Release

      - name: Pack
        shell: bash
        run: ${{ matrix.script }}

      # Names vary per script; take whatever landed in dist/.
      - name: Collect
        shell: bash
        run: |
          ls -la dist/
          mkdir -p out
          find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} out/ \;
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: out/
          if-no-files-found: error

  release:
    name: draft the release
    needs: pack
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p upload
          find artifacts -type f -exec cp {} upload/ \;
          ls -la upload/

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: upload/*
