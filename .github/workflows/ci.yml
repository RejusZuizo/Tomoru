name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other OSes when one fails — a platform-specific break
      # is exactly what this matrix is here to catch.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      # Two SDKs on purpose. The app still targets net8.0, but Avalonia 12's
      # source generators need Roslyn 4.14, which only ships with the .NET 10
      # SDK — and when the generator is too old it silently doesn't run rather
      # than failing, so every InitializeComponent() goes missing instead. The
      # 8.0 SDK stays for the runtime that net8.0 tests execute against.
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Tomoshibi.sln

      - name: Build
        run: dotnet build Tomoshibi.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Tomoshibi.sln --configuration Release --no-build --verbosity normal
