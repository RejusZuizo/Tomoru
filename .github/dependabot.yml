version: 2
updates:
  # NuGet packages for the app and test project (the .sln at the root ties
  # them together). Dependabot opens a PR when one is outdated or has a known
  # vulnerability — CI then builds and tests the bump before it can merge.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Avalonia 12 is a breaking major, and Avalonia.Diagnostics never shipped
    # for it — moving the UI across is a deliberate piece of work, not a
    # dependency bump. Stay current on the 11.x line until it's planned in.
    ignore:
      - dependency-name: "Avalonia*"
        update-types: ["version-update:semver-major"]

  # Keep the GitHub Actions in the CI/CodeQL workflows current too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
